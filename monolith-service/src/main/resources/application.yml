server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  application:
    name: project-os-monolith-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15433/project_os}
    username: ${DB_USERNAME:project_os_owner}
    password: ${DB_PASSWORD:postgres_dev_password_123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

app:
  monolith:
    enabled: true
  resources: ${APP_RESOURCES:projects,tasks,documents,attendance,organizations}
  internal-token: ${INTERNAL_SERVICE_TOKEN:super_internal_token_project_os_dev_at_least_32_chars}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:super_internal_token_project_os_dev_at_least_32_chars}
  organization-service-url: http://localhost:8080
  project-service-url: http://localhost:8080
  rbac:
    enabled: true
    internal-token: ${INTERNAL_SERVICE_TOKEN:super_internal_token_project_os_dev_at_least_32_chars}
    project-service-url: http://localhost:8080
    organization-service-url: http://localhost:8080
  outbox:
    enabled: ${OUTBOX_ENABLED:false}
    internal-token: ${INTERNAL_SERVICE_TOKEN:super_internal_token_project_os_dev_at_least_32_chars}
    activity-url: http://localhost:8080
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:project-os}
  jwt:
    secret: ${JWT_SECRET:super_secret_jwt_key_project_os_dev_at_least_32_chars_long}
    ttl-hours: ${JWT_TTL_HOURS:8}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:AdminPassword123!}
    display-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${OPENAPI_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always
