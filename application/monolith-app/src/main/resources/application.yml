server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: project-os-monolith
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project_os}
    username: ${DB_USERNAME:project_os_owner}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: false
  flyway:
    enabled: true
    default-schema: public
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-on-migrate: true
    locations: classpath:db/migration/monolith
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      ssl:
        enabled: ${REDIS_SSL:false}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

app:
  monolith:
    enabled: true
  resources: ${APP_RESOURCES:projects,members,roles,role-assignments,settings,tasks,task-columns,sprints,epics,user-stories,bugs,bug-columns,daily-reports,documents,folders,wikis,wiki-links,attachments,doc-activities,training,training-attendees,resources,risks,budget-items,expenses,timeline-phases,milestones,meetings,notes,action-items,comments,activities,notifications}
  immutable-resources: activities
  internal-token: ${INTERNAL_SERVICE_TOKEN}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  rbac:
    enabled: true
    internal-token: ${INTERNAL_SERVICE_TOKEN}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    interval-ms: ${OUTBOX_INTERVAL_MS:5000}
    internal-token: ${INTERNAL_SERVICE_TOKEN}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:project-os}
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: ${JWT_TTL_HOURS:8}
  cookie:
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
  security:
    openapi-public: ${OPENAPI_PUBLIC:false}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${OPENAPI_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${ACTUATOR_HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true
