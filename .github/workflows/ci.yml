name: backend-ci

on:
  pull_request:
  push:
    branches: [main, master, feat/**]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash ./scripts/db/validate_flyway_migration_names.sh
      - run: bash ./scripts/architecture/verify-monolith-boundary.sh
      - run: bash ./mvnw -B -q -pl application/monolith-app -am verify
      - run: docker compose -f compose.monolith.yaml config --quiet
      - run: docker compose -f compose.monolith.prod.yaml config --quiet

  image-build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: monolith
            path: application/monolith-app
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build tested image and publish immutable main release
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=${{ matrix.path }}
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: ghcr.io/nguyenphat2412/project-os-${{ matrix.name }}:${{ github.sha }}
