server.port: ${SERVER_PORT:8084}
spring:
  application.name: operations
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project_os}
    username: ${DB_USERNAME:${POSTGRES_USER:project_os_owner}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:postgres_dev_password_123456}}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:5}
  flyway:
    create-schemas: true
    default-schema: operations
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.default_schema: operations
    properties.hibernate.type.json_format_mapper: jackson3
management.endpoints.web.exposure.include: health,info
management.tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.zipkin.endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
springdoc:
  api-docs.enabled: ${OPENAPI_ENABLED:false}
  swagger-ui.enabled: ${OPENAPI_ENABLED:false}
app:
  jwt.secret: ${JWT_SECRET}
  resources: risks,budget-items,expenses,timeline-phases,milestones,meetings,notes,action-items
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    internal-token: ${INTERNAL_SERVICE_TOKEN}
  rbac:
    enabled: ${RBAC_ENABLED:true}
    internal-token: ${INTERNAL_SERVICE_TOKEN}
