name: project-os-monolith

services:
  postgres:
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_os
      POSTGRES_USER: project_os_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_monolith_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_os_owner -d project_os"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [project-os-monolith-net]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: redis-server --save "" --appendonly no --maxmemory 96mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [project-os-monolith-net]

  zipkin:
    image: openzipkin/zipkin:3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ZIPKIN_PORT:-19411}:9411"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [project-os-monolith-net]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_monolith_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [project-os-monolith-net]

  monolith-app:
    build:
      context: .
      dockerfile: Dockerfile
      args: { MODULE: application/monolith-app }
    restart: unless-stopped
    mem_limit: 768m
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: jdbc:postgresql://postgres:5432/project_os
      DB_USERNAME: project_os_owner
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-false}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-project-os}
      # Keep the module-level storage configuration compatible with the
      # canonical object-storage variables above during the monolith rollout.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}}
      MINIO_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}}
      MINIO_BUCKET: ${OBJECT_STORAGE_BUCKET:-project-os}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      OUTBOX_INTERVAL_MS: ${OUTBOX_INTERVAL_MS:-5000}
      ACTUATOR_HEALTH_SHOW_DETAILS: ${ACTUATOR_HEALTH_SHOW_DETAILS:-when_authorized}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      NINEROUTER_URL: http://host.docker.internal:20128
      NINEROUTER_KEY: ${NINEROUTER_KEY:?NINEROUTER_KEY is required}
      NINEROUTER_CONNECT_TIMEOUT: ${NINEROUTER_CONNECT_TIMEOUT:-2s}
      NINEROUTER_READ_TIMEOUT: ${NINEROUTER_READ_TIMEOUT:-60s}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      OPENAPI_PUBLIC: ${OPENAPI_PUBLIC:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-false}
      EMAIL_WORKER_INTERVAL_MS: ${EMAIL_WORKER_INTERVAL_MS:-10000}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-50}
      EMAIL_WORKER_MAX_ATTEMPTS: ${EMAIL_WORKER_MAX_ATTEMPTS:-3}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_CONNECT_TIMEOUT_MS: ${SMTP_CONNECT_TIMEOUT_MS:-10000}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-15000}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-20MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-25MB}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      zipkin:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [project-os-monolith-net]

networks:
  project-os-monolith-net:

volumes:
  postgres_monolith_data:
  minio_monolith_data:
