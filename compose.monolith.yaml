name: project-os-monolith

services:
  postgres:
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_os
      POSTGRES_USER: project_os_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password_123456}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_dev_password_123456}
      ORGANIZATION_DB_PASSWORD: ${ORGANIZATION_DB_PASSWORD:-org_dev_password_123456}
      ATTENDANCE_DB_PASSWORD: ${ATTENDANCE_DB_PASSWORD:-attendance_dev_password_123456}
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD:-project_dev_password_123456}
      WORK_DB_PASSWORD: ${WORK_DB_PASSWORD:-work_dev_password_123456}
      OPERATIONS_DB_PASSWORD: ${OPERATIONS_DB_PASSWORD:-operations_dev_password_123456}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:-knowledge_dev_password_123456}
      ACTIVITY_DB_PASSWORD: ${ACTIVITY_DB_PASSWORD:-activity_dev_password_123456}
    volumes:
      - postgres_monolith_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_os_owner -d project_os"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [project-os-monolith-net]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: redis-server --save "" --appendonly no --maxmemory 96mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [project-os-monolith-net]

  monolith-service:
    build:
      context: .
      dockerfile: Dockerfile
      args: { MODULE: monolith-service }
    restart: unless-stopped
    mem_limit: 768m
    environment:
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://postgres:5432/project_os
      DB_USERNAME: project_os_owner
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password_123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_project_os_dev_at_least_32_chars_long}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-super_internal_token_project_os_dev_at_least_32_chars}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-AdminPassword123!}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [project-os-monolith-net]

networks:
  project-os-monolith-net:

volumes:
  postgres_monolith_data:
