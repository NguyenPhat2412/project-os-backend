name: project-os-monolith

# Production profile for a managed/private PostgreSQL instance.
# The database is intentionally not declared here. The application runtime
# receives DB_URL/DB_USERNAME/DB_PASSWORD from a secret manager or env file.
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --maxmemory 192mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks: [project-os-private]

  monolith-app:
    image: ${PROJECT_OS_MONOLITH_IMAGE:?PROJECT_OS_MONOLITH_IMAGE is required}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: "1.50"
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      SPRING_FLYWAY_ENABLED: "false"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_SSL: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      NINEROUTER_URL: ${NINEROUTER_URL:?NINEROUTER_URL is required}
      NINEROUTER_KEY: ${NINEROUTER_KEY:?NINEROUTER_KEY is required}
      NINEROUTER_CONNECT_TIMEOUT: ${NINEROUTER_CONNECT_TIMEOUT:-2s}
      NINEROUTER_READ_TIMEOUT: ${NINEROUTER_READ_TIMEOUT:-60s}
      EMAIL_WORKER_ENABLED: ${EMAIL_WORKER_ENABLED:-false}
      EMAIL_WORKER_INTERVAL_MS: ${EMAIL_WORKER_INTERVAL_MS:-10000}
      EMAIL_WORKER_BATCH_SIZE: ${EMAIL_WORKER_BATCH_SIZE:-50}
      EMAIL_WORKER_MAX_ATTEMPTS: ${EMAIL_WORKER_MAX_ATTEMPTS:-3}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_CONNECT_TIMEOUT_MS: ${SMTP_CONNECT_TIMEOUT_MS:-10000}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-15000}
      OUTBOX_ENABLED: "true"
      OUTBOX_INTERVAL_MS: ${OUTBOX_INTERVAL_MS:-5000}
      OPENAPI_ENABLED: "false"
      OPENAPI_PUBLIC: "false"
      RATE_LIMIT_ENABLED: "true"
      ACTUATOR_HEALTH_SHOW_DETAILS: "never"
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?OBJECT_STORAGE_ENDPOINT is required}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?OBJECT_STORAGE_ACCESS_KEY is required}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?OBJECT_STORAGE_SECRET_KEY is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks: [project-os-private]

networks:
  project-os-private:
    driver: bridge
